name: Build Desktop release artifacts

on:
  workflow_call:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-windows:
    name: Build Windows NSIS and MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Build workspace
        run: pnpm build

      - name: Stage builtin plugins
        run: pnpm builtin-plugins:stage -- --out apps/desktop/.vite/builtin-plugins --skip-build

      - name: Build Windows packages
        run: pnpm --filter @tooldeck/desktop exec electron-builder --win --publish never

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.msi
            apps/desktop/release/latest.yml

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Build workspace
        run: pnpm build

      - name: Stage builtin plugins
        run: pnpm builtin-plugins:stage -- --out apps/desktop/.vite/builtin-plugins --skip-build

      - name: Build Linux packages
        run: pnpm --filter @tooldeck/desktop exec electron-builder --linux AppImage --publish never

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.blockmap
            apps/desktop/release/latest-linux.yml

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Build workspace
        run: pnpm build

      - name: Stage builtin plugins
        run: pnpm builtin-plugins:stage -- --out apps/desktop/.vite/builtin-plugins --skip-build

      - name: Build macOS package
        run: pnpm --filter @tooldeck/desktop exec electron-builder --mac dmg --publish never

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          if-no-files-found: error
          path: apps/desktop/release/*.dmg
