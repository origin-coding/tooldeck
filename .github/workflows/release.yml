name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Verify release tag and commit
        run: node scripts/check-release-ref.mjs

      - name: Verify workspace
        uses: ./.github/actions/verify-workspace

      - name: Verify npm publish dry-run
        run: pnpm run publish:npm-trusted -- --dry-run

  build-desktop:
    name: Build Desktop artifacts
    needs: verify
    uses: ./.github/workflows/desktop-release.yml

  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs:
      - verify
      - build-desktop
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Verify release tag and commit
        run: node scripts/check-release-ref.mjs

      - name: Show npm version
        run: npm --version

      - name: Build workspace
        run: pnpm build

      - name: Publish npm packages
        shell: bash
        run: |
          git fetch --no-tags origin "+${GITHUB_REF}:${GITHUB_REF}"
          node scripts/check-release-ref.mjs
          pnpm run publish:npm-trusted

  publish-desktop-release:
    name: Publish GitHub Release and Desktop assets
    runs-on: ubuntu-latest
    needs:
      - build-desktop
      - publish-npm
    environment: desktop-production
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download Desktop release assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Verify release tag and commit
        shell: bash
        run: |
          git fetch --no-tags origin "+${GITHUB_REF}:${GITHUB_REF}"
          node scripts/check-release-ref.mjs

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No Desktop release assets were downloaded."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$RELEASE_REPOSITORY" \
              --title "Tooldeck $RELEASE_TAG" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
